# 空间预热派生负载：公开uniform生成器，全更新；不是原始Workload A。
recordcount=655360
operationcount=1200000
fieldcount=1
fieldlength=4096
readallfields=true
writeallfields=true
readproportion=0
updateproportion=1
scanproportion=0
insertproportion=0
requestdistribution=uniform
insertorder=ordered
zeropadding=20
rocksdb.dbname=/rrzc-ycsb
rocksdb.fs_uri=zenfs://dev:nvme0n1
rocksdb.destroy=false
rocksdb.disable_wal=true
rocksdb.no_block_cache=true
rocksdb.compression=no
