# YCSB-C++读密集派生短测：已有latest生成器及有序键，不冒称原始Workload B。
recordcount=655360
operationcount=600000
fieldcount=1
fieldlength=4096
readallfields=true
writeallfields=true
readproportion=0.95
updateproportion=0.05
scanproportion=0
insertproportion=0
requestdistribution=latest
insertorder=ordered
zeropadding=20
rocksdb.dbname=/rrzc-ycsb
rocksdb.fs_uri=zenfs://dev:nvme0n1
rocksdb.destroy=false
# 四组统一禁用WAL，仅比较维护机制，不评估崩溃持久性。
rocksdb.disable_wal=true
rocksdb.no_block_cache=true
rocksdb.compression=no
rocksdb.max_background_jobs=2
rocksdb.target_file_size_base=16777216
rocksdb.max_bytes_for_level_base=134217728
rocksdb.write_buffer_size=16777216
rocksdb.max_write_buffer_number=3
rocksdb.level0_file_num_compaction_trigger=2
rocksdb.use_direct_io_for_flush_compaction=true
rocksdb.use_direct_reads=true
rocksdb.bloom_bits=10
# 保持键数和业务次数，只降低公开限速器的请求上限，给Compaction推进时间。
limit.ops=1000
measurementtype=hdrhistogram
status=true
status.interval=10
sleepafterload=30
